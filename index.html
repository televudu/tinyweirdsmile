<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Weird Smile · Stage Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

      <div class="story-stage">

        <figure class="story-item" data-key="intro-llave">
          <img src="recortadas/intro-front-llave.jpg" alt="Intro llave" draggable="false" />
        </figure>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
