<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Weird Smile · Stage Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage-wrapper" data-stage>
      <div class="story-stage" data-story-stage>
        <div class="layer" data-layer="bg"></div>
        <div class="layer" data-layer="mid"></div>
        <div class="layer" data-layer="front"></div>
      </div>
      <div class="loop-overlay" data-loop-overlay hidden></div>
    </div>

    <button type="button" class="layout-toggle" data-layout-toggle>
      Modo layout
    </button>

    <div class="title-screen" data-title-screen>
      <div class="title-screen__inner">
        <h1 class="title-screen__heading">Tiny Weird Smile</h1>
      </div>
    </div>

    <aside class="layout-panel" data-layout-panel hidden>
      <header class="layout-panel__header">
        <strong class="layout-panel__title">Layout actual</strong>
        <button type="button" class="layout-panel__copy" data-layout-copy>
          Copiar JSON
        </button>
      </header>
      <pre class="layout-panel__output" data-layout-output>{}</pre>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
