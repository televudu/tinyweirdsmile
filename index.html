<!DOCTYPE html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Weird Smile · Stage Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage-wrapper" data-stage>
      <div class="story-stage" data-story-stage>

      <div class="title-screen__inner">
        <h1 class="title-screen__heading">Tiny Weird Smile(∞)Tiny Dark Smile</h1>
